<!doctype html><meta charset="utf-8"><title>36 positions visual audit</title><style>body{background:#17251e;color:#eee;font:13px system-ui;margin:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}figure{margin:0}img{width:100%;display:block}figcaption{padding:4px}</style><div class="grid"></div><script type="module">const rows=await(await fetch('./scene-audit.json')).json();const order=['cafe','airport','bank','hotel','restaurant','shopping','hospital','university','office','phone','car_rental','museum'];let group=Number(new URLSearchParams(location.search).get('group')||0);for(const id of order.slice(group*3,group*3+3)){const scene=rows.find(row=>row.scene===id);for(let i=0;i<3;i++){document.querySelector('.grid').insertAdjacentHTML('beforeend',`<figure><figcaption>${scene.title} · ${scene.anchors[i].title}</figcaption><img src="after-${id}-${i+1}.png"></figure>`);}}</script>
